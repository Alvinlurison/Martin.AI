<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061a33"><link rel="manifest" href="manifest.json"><title>MARTIN AI</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#020b18,#062b55,#071a35);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;padding:22px 16px 30px}header{text-align:center;padding:18px 0}.orb{width:92px;height:92px;margin:auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#7bdcff 0 8%,#1464a5 30%,#061a33 68%);box-shadow:0 0 35px #1aa9ff66;font-size:25px;font-weight:800}h1{margin:12px 0 4px;letter-spacing:4px}.status{opacity:.75;font-size:14px}.card{background:#ffffff10;border:1px solid #ffffff18;border-radius:20px;padding:16px;margin-top:14px;backdrop-filter:blur(12px)}#chat{min-height:260px;max-height:45vh;overflow:auto}.msg{padding:11px 13px;border-radius:15px;margin:9px 0;line-height:1.45;white-space:pre-wrap}.user{background:#0e5d91;margin-left:12%}.martin{background:#ffffff12;margin-right:8%}.controls{display:flex;gap:10px;margin-top:12px}textarea{flex:1;resize:none;min-height:52px;border-radius:15px;border:1px solid #ffffff22;background:#071a31;color:#fff;padding:14px;font-size:16px}button{border:0;border-radius:15px;padding:13px 16px;background:#1679bd;color:white;font-weight:700}button:active{transform:scale(.97)}#mic{width:62px;font-size:22px}.listening{box-shadow:0 0 0 4px #36cfff55,0 0 25px #36cfff88}input{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff22;background:#071a31;color:white}.row{display:flex;gap:10px;margin-top:10px}small{opacity:.65;line-height:1.4}</style></head><body><div class="app"><header><div class="orb">M</div><h1>MARTIN</h1><div class="status" id="status">Offline — enter a Gemini API key</div></header><div class="card" id="chat"><div class="msg martin">Hello King. MARTIN is ready.</div></div><div class="card"><input id="key" type="password" placeholder="Paste a NEW Gemini API key here"><div class="row"><button id="saveKey">Save key</button><button id="clearKey">Clear</button></div><small>Prototype only: the key is stored in this browser. Never paste a publicly exposed key.</small></div><div class="card"><div class="controls"><textarea id="input" placeholder="Type to MARTIN..."></textarea><button id="mic">🎙️</button><button id="send">Send</button></div><div class="row"><button id="wake">Start MARTIN voice mode</button><button id="stop">Stop</button></div></div></div><script>const MODEL="gemini-3.8-flash";let key=localStorage.getItem("martin_gemini_key")||"",recognition=null,voiceMode=false,busy=false;const $=id=>document.getElementById(id);$("key").value=key?"••••••••••••••••":"";function setStatus(s){$("status").textContent=s}function addMsg(who,text){const d=document.createElement("div");d.className="msg "+(who==="MARTIN"?"martin":"user");d.textContent=text;$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight}function speak(text){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=1;speechSynthesis.speak(u)}async function askMartin(text){if(!key){addMsg("MARTIN","I need a Gemini API key first. Paste a NEW key above.");speak("I need a Gemini API key first.");return}if(busy)return;busy=true;setStatus("MARTIN is thinking...");addMsg("USER",text);$("input").value="";try{const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({systemInstruction:{parts:[{text:"You are MARTIN, the user's personal AI assistant. The user may be called King, Havaganster, or Adeka. Be concise, natural, useful, and friendly. Do not claim to have performed actions you did not actually perform."}]},contents:[{role:"user",parts:[{text:text}]}],generationConfig:{temperature:.7,maxOutputTokens:700}})});const data=await r.json();if(!r.ok)throw new Error(data?.error?.message||("HTTP "+r.status));const answer=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("").trim();if(!answer)throw new Error("No response text returned.");addMsg("MARTIN",answer);speak(answer);setStatus("MARTIN online")}catch(e){addMsg("MARTIN","Connection error: "+e.message);setStatus("Gemini connection failed")}finally{busy=false}}function startRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addMsg("MARTIN","Voice recognition is not supported here. Use Chrome on Android.");return}recognition=new SR();recognition.lang="en-US";recognition.continuous=voiceMode;recognition.interimResults=false;recognition.onstart=()=>{$("mic").classList.add("listening");setStatus(voiceMode?'Listening for "MARTIN"...':'Listening...')};recognition.onend=()=>{$("mic").classList.remove("listening");if(voiceMode&&!busy)setTimeout(startRecognition,300);else setStatus("MARTIN online")};recognition.onerror=e=>{setStatus("Voice: "+e.error)};recognition.onresult=e=>{const text=e.results[e.results.length-1][0].transcript.trim();if(!text)return;if(voiceMode){const lower=text.toLowerCase(),i=lower.indexOf("martin");if(i>=0){const command=text.slice(i+6).trim().replace(/^[,.:;-]+/,"").trim();if(command)askMartin(command);else speak("Yes King. I'm listening.")}}else askMartin(text)};recognition.start()}$("saveKey").onclick=()=>{const entered=$("key").value.trim();if(entered&&!entered.startsWith("•")){key=entered;localStorage.setItem("martin_gemini_key",key)}setStatus(key?"MARTIN online":"Offline — enter a Gemini API key")};$("clearKey").onclick=()=>{key="";localStorage.removeItem("martin_gemini_key");$("key").value="";setStatus("Offline — enter a Gemini API key")};$("send").onclick=()=>{const t=$("input").value.trim();if(t)askMartin(t)};$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("send").click()}});$("mic").onclick=()=>{voiceMode=false;startRecognition()};$("wake").onclick=()=>{voiceMode=true;startRecognition();speak("MARTIN voice mode is online.")};$("stop").onclick=()=>{voiceMode=false;if(recognition)recognition.stop();speechSynthesis.cancel();setStatus("MARTIN stopped")};if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
